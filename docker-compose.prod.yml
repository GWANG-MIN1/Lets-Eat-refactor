version: '3.9'

services:
  server:
    image: ${ECR_IMAGE}
    ports:
      - "3000:3000"
    volumes:
      - db_data:/app/letseat.db
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
